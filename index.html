<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="AIにお題を生成してもらうためのシンプルなWebアプリです。">
    <meta name="theme-color" content="#f59e0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="お題生成器">
    <title>お題生成器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>お題生成</h1>
        <button id="generateButton">生成！</button>
        <div class="mode-select-container">
            <label><input type="checkbox" id="choiceOnly"> 選択肢のみ</label>
        </div>
        <div class="custom-word-container">
            <label><input type="checkbox" id="customWordMode"> ワード指定</label>
            <input type="text" id="customWordInput" placeholder="単語・最大10文字" maxlength="10" disabled>
        </div>
        <p id="ideaDisplay"></p>
        <div class="model-select-container">
            <label for="modelSelect">モデルを選択:</label>
            <br>
            <select id="modelSelect">
                <optgroup label="Gemini">
                    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                    <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite</option>
                    <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
                    <option value="gemini-3-flash">Gemini 3 Flash</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
                </optgroup>
                <optgroup label="Gemma">
                    <option value="gemma-4-26b-a4b-it">Gemma 4 26B</option>
                    <option value="gemma-4-31b-it">Gemma 4 31B</option>
                </optgroup>
            </select>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
