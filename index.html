<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>お題生成器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>お題生成</h1>
        <button id="generateButton">生成！</button>
        <p id="ideaDisplay"></p>
        <div class="model-select-container">
            <label for="modelSelect">モデルを選択:</label>
            <br>
            <select id="modelSelect">
                <option value="gemma-3-27b-it">Gemma 3 27B</option>
                <option value="gemma-3-12b-it" selected>Gemma 3 12B</option>
                <option value="gemma-3-4b-it">Gemma 3 4B</option>
                <option value="gemma-3-2b-it">Gemma 3 2B</option>
                <option value="gemma-3-1b-it">Gemma 3 1B</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash (Limited)</option>
                <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite (Limited)</option>
            </select>
        </div>
</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
