<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>お題生成器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>お題生成</h1>
        <button id="generateButton">生成！</button>
        <p id="ideaDisplay"></p>
        <div class="model-select-container">
            <label for="modelSelect">モデルを選択:</label>
            <br>
            <select id="modelSelect">
                <optgroup label="Gemini">
                    <option value="gemini-3.1-flash-lite-preview" selected>Gemini 3.1 Flash Lite</option>
                    <option value="gemini-3-flash-preview">Gemini 3 Flash</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
                    <option value="gemini-2.5-flash-preview-tts">Gemini 2.5 Flash TTS</option>
                </optgroup>
                <optgroup label="Gemma 4">
                    <option value="gemma-4-31b-it">Gemma 4 31B</option>
                    <option value="gemma-4-26b-a4b-it">Gemma 4 26B</option>
                </optgroup>
                <optgroup label="Gemma 3n">
                    <option value="gemma-3n-e4b-it">Gemma 3n E4B</option>
                    <option value="gemma-3n-e2b-it">Gemma 3n E2B</option>
                </optgroup>
                <optgroup label="Gemma 3">
                    <option value="gemma-3-27b-it">Gemma 3 27B</option>
                    <option value="gemma-3-12b-it">Gemma 3 12B</option>
                    <option value="gemma-3-4b-it">Gemma 3 4B</option>
                    <option value="gemma-3-1b-it">Gemma 3 1B</option>
                </optgroup>
            </select>
        </div>
</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
